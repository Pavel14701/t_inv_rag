[project]
name = "dte-infer"
version = "0.1.0"
description = "Inference CLI: candles -> DSL signals -> optional P(win) (TZ-05)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "polars>=1.42.1",
    "pyyaml>=6.0.3",
    "t-tech-investments>=0.3.3",
    "yfinance>=1.5.1",
]

[project.optional-dependencies]
# ML-инференс (--ml) требует model bundle, собранный dte-ai (TZ-06 п.2.4).
ml = ["torch>=2.4.1"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-mock>=3.15.1",
]

[tool.uv]
package = false
