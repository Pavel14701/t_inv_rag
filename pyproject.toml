[project]
name = "deterministic-trading-engine"
version = "0.1.0"
description = "Deterministic algorithmic trading system: DSL, ta indicators, Transformer P(win), RAG as an auxiliary layer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"

# Корневой проект — workspace-обвязка: инструменты разработки и общий тестовый
# стек. Рантайм-зависимости распределены по членам workspace (uv workspaces).
# См. dev_docs/tz/TZ-00-roadmap.md п. «Монорепозиторий».
dependencies = []

[tool.uv.workspace]
members = [
    "ta",
    "dsl",
    "strategies",
    "ai",
    "infer",
    "rag",
    "risk",
    "main",
]

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260518",
    "mypy==2.1.0",
    "pytest==9.1.1",
    "pytest-mock>=3.15.1",
    "pytest-asyncio>=1.4.0",
    "flake8==7.3.0",
    "flake8-docstrings==1.7.0",
    "pep8-naming==0.15.1",
    "pycodestyle==2.14.0",
    "ruff==0.15.20",
    "isort==8.0.1",
    "flake8-pyproject==1.2.4",
    "flake8-pie>=0.16.0",
]

[[tool.uv.index]]
url = "https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple"
default = true

[tool.ruff]
line-length = 79
target-version = "py312"
exclude = [".venv/", "**/migrations/*", ".mypy_cache/", "__pycache__/"]
fix = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (undefined/unused names)
    "Q",    # quotes
    "D",    # pydocstyle
    "N",    # pep8-naming
    "I",    # import order (replaces isort)
    "B",    # bugbear (real bug patterns)
    "RUF",  # unicode/ambiguity guards (EN-only discipline, TZ-14)
]
ignore = [
    "E203",
    "D100",
    "D107",
    "D203",
    "D205",
    "D213",
    "D400",
    "D401",
]
preview = true

[tool.ruff.lint.per-file-ignores]
# Тесты: без требования докстрингов, но E/F/B/RUF/I действуют
# (EN-only дисциплина распространяется и на тесты, TZ-14 п.2.1).
"tests/**" = ["D"]
"**/tests/**" = ["D"]
"test_*.py" = ["D"]
"conftest.py" = ["D"]
# Легаси-адаптеры strategies/src/infrastructure: переписываются в TZ-02;
# держим только критичные правила (F, E, RUF).
"strategies/src/infrastructure/**" = ["D", "N"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = 88

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"

[tool.ruff.lint.isort]
force-single-line = false
force-wrap-aliases = true
lines-after-imports = 2
lines-between-types = 1
combine-as-imports = true

[tool.isort]
profile = "black"
line_length = 79
lines_after_imports = 2
lines_between_types = 1
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
combine_as_imports = true
force_single_line = false

[tool.flake8]
max-line-length = 79
max-complexity = 10
ignore = [
    "W503",
    "F811",
    "D100",
    "D107",
    "D203",
    "D205",
    "D213",
    "D400",
    "D401",
    "N806",
    "N818",
]
exclude = [
    "tests/",
    "venv/",
    "env/",
    ".venv/",
    "src/",
    "node_modules/"
]


[tool.mypy]
ignore_missing_imports = true
explicit_package_bases = true 
namespace_packages = true

[tool.pytest.ini_options]
# Единая точка конфигурации pytest (TZ-14 п.2.3): per-package pytest.ini
# ликвидированы. Прогон работает одинаково из корня и из пакета:
#   uv run pytest                          # весь монорепозиторий
#   uv run --package dte-dsl pytest dsl/tests
pythonpath = ["."]
testpaths = [
    "dsl/tests",
    "ta/tests",
    "ai/tests",
    "infer/tests",
    "rag/tests",
    "risk/tests",
]
addopts = "-v --tb=short --strict-markers -m \"not deprecated\""
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

markers = [
    # --- сквозные (внутренние) маркеры ---
    "unit: fast isolated tests",
    "integration: tests touching services/network/files",
    "slow: > 5s tests (opt-in via -m slow)",
    "deprecated: scheduled for removal (excluded by default)",
    # --- service-маркеры (разделение по сервисам, TZ-14 п.2.3) ---
    # Проставляются автоматически hook'ом pytest_collection_modifyitems
    # в conftest.py каждого пакета; вручную не дублировать.
    "dsl: belongs to the dte-dsl package",
    "ta: belongs to the dte-ta package",
    "ai: belongs to the dte-ai package",
    "infer: belongs to the dte-infer package",
    "rag: belongs to the dte-rag package",
    "risk: belongs to the dte-risk package",
    "main: belongs to the dte-main package",
    "strategies: belongs to the dte-strategies package",
    # --- доменные маркеры (унаследованы из per-package pytest.ini) ---
    "candle: [ta] candle-pattern indicators",
    "custom: [ta] custom indicators",
    "momentum: [ta] momentum indicators",
    "overlap: [ta] overlap indicators",
    "statistics: [ta] statistics indicators",
    "trend: [ta] trend indicators",
    "volatility: [ta] volatility indicators",
    "volume: [ta] volume indicators",
    "performance: [ta] performance/speed tests",
    "tokenizer: [dsl] tokenizer module",
    "parser: [dsl] parser module",
    "ast: [dsl] AST serialization",
    "interpreter: [dsl] interpreter module",
    "manifest: [dsl] manifest and validator",
    "provider: [dsl] provider implementations",
    "evaluate: [dsl] evaluate_dsl entry point",
    "error: [dsl] error-handling tests",
    "async_test: [dsl] asynchronous tests",
    "with_providers: [dsl] tests using mock/real providers",
    "without_providers: [dsl] tests without providers",
]

filterwarnings = [
    # Сторонний шум, на который мы не влияем:
    "ignore:The PyTorch API of nested tensors is in prototype stage.*:UserWarning",
    "ignore:Type google._upb._message.*:DeprecationWarning",
    "ignore::DeprecationWarning:numba.*",
    "ignore::PendingDeprecationWarning",
    # TA-Lib опционален; отсутствие — штатный фолбэк, а не ошибка данных:
    "ignore:TA-Lib not installed.*:UserWarning:ta\\.src\\.external",
]

