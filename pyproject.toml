[project]
name = "deterministic-trading-engine"
version = "0.1.0"
description = "Deterministic algorithmic trading system: DSL, ta indicators, Transformer P(win), RAG as an auxiliary layer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"

# Корневой проект — workspace-обвязка: инструменты разработки и общий тестовый
# стек. Рантайм-зависимости распределены по членам workspace (uv workspaces).
# См. dev_docs/tz/TZ-00-roadmap.md п. «Монорепозиторий».
dependencies = []

[tool.uv.workspace]
members = [
    "ta",
    "dsl",
    "strategies",
    "ai",
    "infer",
    "rag",
    "risk",
    "backtest",
    "contracts",
    "main",
]

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260518",
    "mypy==2.1.0",
    "pytest==9.1.1",
    "pytest-mock>=3.15.1",
    "pytest-asyncio>=1.4.0",
    "ruff==0.15.20",
]

[[tool.uv.index]]
url = "https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple"
default = true

[tool.ruff]
line-length = 79
target-version = "py312"
exclude = [".venv/", "**/migrations/*", ".mypy_cache/", "__pycache__/"]
fix = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes (undefined/unused names)
    "Q",    # quotes
    "D",    # pydocstyle
    "N",    # pep8-naming
    "I",    # import order (replaces isort)
    "B",    # bugbear (real bug patterns)
    "RUF",  # unicode/ambiguity guards (EN-only discipline, TZ-14)
]
ignore = [
    "E203",
    "D100",
    "D107",
    "D203",
    "D205",
    "D213",
    "D400",
    "D401",
]
preview = true

[tool.ruff.lint.per-file-ignores]
# Tests: docstrings not required, but E/F/B/RUF/I still apply
# (EN-only discipline covers tests too, TZ-14 item 2.1).
# RUF069 is relaxed here: exact-literal float checks (== 0.0, == 1.0) in
# tests are intentional for IEEE-semantics assertions; new tests should
# prefer pytest.approx (see dev_docs/testing_convention.md section 4).
"tests/**" = ["D", "RUF069"]
"**/tests/**" = ["D", "RUF069"]
"test_*.py" = ["D", "RUF069"]
"conftest.py" = ["D", "RUF069"]
"**/__init__.py" = ["RUF067"]
# Легаси-адаптеры strategies/src/infrastructure: переписываются в TZ-02;
# держим только критичные правила (F, E, RUF).
"strategies/src/infrastructure/**" = ["D", "N"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = 88

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
multiline-quotes = "double"
docstring-quotes = "double"

[tool.ruff.lint.isort]
force-single-line = false
force-wrap-aliases = true
lines-after-imports = 2
lines-between-types = 1
combine-as-imports = true

[tool.mypy]
# Staged strictness (TZ-14 п.2.2): global baseline is lenient; modules are
# promoted to strict per wave. `disallow_untyped_defs` for a module means
# every public function must be annotated - regressions block.
python_version = "3.12"
ignore_missing_imports = true
explicit_package_bases = true
namespace_packages = true
exclude = ["migrations", ".venv", "ta/tests", "dsl/tests", "ai/src/tests", "ai/tests", "rag/tests", "risk/tests", "strategies/tests", "infer/tests", "main/src/tests"]

# Wave 1 (done): new packages are born strict.
[tool.mypy-risk]
disallow_untyped_defs = true
warn_return_any = true
check_untyped_defs = true

# Wave 2 (planned): ai, infer - promote when error count reaches zero.
[tool.mypy-ai.src]
disallow_untyped_defs = true
warn_return_any = true
check_untyped_defs = true
[tool.mypy-infer]
disallow_untyped_defs = false

[tool.pytest.ini_options]
# Single source of pytest config (TZ-14 п.2.3): per-package pytest.ini
# files are removed. Runs identically from the root and from a package:
#   uv run pytest                          # whole monorepo
#   uv run --package dte-dsl pytest dsl/tests
pythonpath = ["."]
testpaths = [
    "dsl/tests",
    "ta/tests",
    "ai/tests",
    "infer/tests",
    "rag/tests",
    "risk/tests",
    "strategies/tests",
    "backtest/tests",
    "contracts/tests",
    "main/tests",
]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
addopts = "-v --tb=short --strict-markers -m \"not deprecated\""
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

markers = [
    # --- cross-cutting markers ---
    "unit: fast isolated tests",
    "integration: tests touching services/network/files",
    "slow: > 5s tests (opt-in via -m slow)",
    "deprecated: scheduled for removal (excluded by default)",
    # --- service markers (per-service separation, TZ-14 п.2.3) ---
    # Applied automatically by the root conftest.py path hook; do not
    # mark tests manually.
    "dsl: belongs to the dte-dsl package",
    "ta: belongs to the dte-ta package",
    "ai: belongs to the dte-ai package",
    "infer: belongs to the dte-infer package",
    "rag: belongs to the dte-rag package",
    "risk: belongs to the dte-risk package",
    "backtest: belongs to the dte-backtest package",
    "main: belongs to the dte-main package",
    "strategies: belongs to the dte-strategies package",
    # --- domain markers (inherited from the former per-package inis) ---
    "candle: [ta] candle-pattern indicators",
    "custom: [ta] custom indicators",
    "momentum: [ta] momentum indicators",
    "overlap: [ta] overlap indicators",
    "statistics: [ta] statistics indicators",
    "trend: [ta] trend indicators",
    "volatility: [ta] volatility indicators",
    "volume: [ta] volume indicators",
    "performance: [ta] performance/speed tests",
    "tokenizer: [dsl] tokenizer module",
    "parser: [dsl] parser module",
    "ast: [dsl] AST serialization",
    "interpreter: [dsl] interpreter module",
    "manifest: [dsl] manifest and validator",
    "provider: [dsl] provider implementations",
    "evaluate: [dsl] evaluate_dsl entry point",
    "error: [dsl] error-handling tests",
    "async_test: [dsl] asynchronous tests",
    "with_providers: [dsl] tests using mock/real providers",
    "without_providers: [dsl] tests without providers",
]

filterwarnings = [
    # Third-party noise we cannot influence:
    "ignore:The PyTorch API of nested tensors is in prototype stage.*:UserWarning",
    "ignore:Type google._upb._message.*:DeprecationWarning",
    "ignore::DeprecationWarning:numba.*",
    "ignore::PendingDeprecationWarning",
    # TA-Lib is optional; its absence is a normal fallback, not an error:
    "ignore:TA-Lib not installed.*:UserWarning:ta\\.src\\.external",
]
