[project]
name = "deterministic-trading-engine"
version = "0.1.0"
description = "Deterministic algorithmic trading system: DSL, ta indicators, Transformer P(win), RAG as an auxiliary layer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"

# Корневой проект — workspace-обвязка: инструменты разработки и общий тестовый
# стек. Рантайм-зависимости распределены по членам workspace (uv workspaces).
# См. dev_docs/tz/TZ-00-roadmap.md п. «Монорепозиторий».
dependencies = []

[tool.uv.workspace]
members = [
    "ta",
    "dsl",
    "strategies",
    "ai",
    "infer",
    "rag",
    "main",
]

[dependency-groups]
dev = [
    "types-pyyaml>=6.0.12.20260518",
    "mypy==2.1.0",
    "pytest==9.1.1",
    "pytest-mock>=3.15.1",
    "pytest-asyncio>=1.4.0",
    "flake8==7.3.0",
    "flake8-docstrings==1.7.0",
    "pep8-naming==0.15.1",
    "pycodestyle==2.14.0",
    "ruff==0.15.20",
    "isort==8.0.1",
    "flake8-pyproject==1.2.4",
    "flake8-pie>=0.16.0",
    "pandas-stubs>=2.3.2.250926",
]

[[tool.uv.index]]
url = "https://opensource.tbank.ru/api/v4/projects/238/packages/pypi/simple"
default = true

[tool.ruff]
line-length = 79
target-version = "py312"
exclude = ["tests/*", ".venv/", "**/migrations/*"]
fix = true

[tool.ruff.lint]
select = ["E","F","Q","D","N"]
ignore = [
    "E203",
    "D100",
    "D107",
    "D203",
    "D205",
    "D213",
    "D400",
    "D401",
]
preview = true

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
skip-magic-trailing-comma = false
docstring-code-format = true
docstring-code-line-length = 88

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "double"
docstring-quotes = "double"

[tool.ruff.lint.isort]
force-single-line = false
force-wrap-aliases = true
lines-after-imports = 2
lines-between-types = 1
combine-as-imports = true

[tool.isort]
profile = "black"
line_length = 79
lines_after_imports = 2
lines_between_types = 1
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
combine_as_imports = true
force_single_line = false

[tool.flake8]
max-line-length = 79
max-complexity = 10
ignore = [
    "W503",
    "F811",
    "D100",
    "D107",
    "D203",
    "D205",
    "D213",
    "D400",
    "D401",
    "N806",
    "N818",
]
exclude = [
    "tests/",
    "venv/",
    "env/",
    ".venv/",
    "src/",
    "node_modules/"
]


[tool.mypy]
ignore_missing_imports = true
explicit_package_bases = true 
namespace_packages = true

[tool.pytest.ini_options]
pythonpath = ["."]

