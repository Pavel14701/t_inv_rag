[pytest]
minversion = 7.0
addopts = -v --tb=short --strict-markers -m "not slow"
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests (fast, isolated, no external dependencies)
    integration: Integration tests (may require data files or more resources)
    slow: Tests that are slow and may be skipped by default
    validation: Tests for validation module
    dataset: Tests for dataset module
    features: Tests for feature engineering
    io: Tests for I/O utilities
    losses: Tests for loss functions
    metrics: Tests for metrics module
    transformer: Tests for transformer model
    training: Tests for training loop
    quickstart: Tests for quickstart module

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore:.*nested tensors is in prototype stage.*:UserWarning