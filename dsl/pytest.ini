[pytest]
minversion = 7.0
addopts = -v --tb=short --strict-markers -m "not deprecated"
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    unit: Unit tests (fast, isolated, no external dependencies)
    integration: Integration tests (full pipeline with providers)
    async_test: Asynchronous tests (require pytest-asyncio)
    with_providers: Tests that use mock or real providers
    without_providers: Tests that run without any providers (only literals)
    error: Tests that verify error handling (expected exceptions)
    tokenizer: Tests for the tokenizer module
    parser: Tests for the parser module
    interpreter: Tests for the interpreter module
    manifest: Tests for manifest and validator
    provider: Tests for provider implementations (InProcess, HTTP, etc.)
    ast: Tests for AST serialization/deserialization
    evaluate: Tests for the evaluate_dsl function (entry point)
    asyncio: Tests using pytest-asyncio (automatically registered by plugin)
    deprecated: Deprecated tests that will be removed in future versions (not run by default).

filterwarnings =
    ignore::DeprecationWarning:dsl.*
    ignore::PendingDeprecationWarning