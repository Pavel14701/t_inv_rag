[project]
name = "dte-dsl"
version = "0.1.0"
description = "Declarative DSL for trading conditions: tokenizer -> parser -> AST -> interpreter, manifest providers"
requires-python = ">=3.12"
dependencies = [
    "niquests>=3.20.1",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-mock>=3.15.1",
    "pytest-asyncio>=1.4.0",
]

[tool.uv]
package = false
