[project]
name = "dte-rag"
version = "0.1.0"
description = "RAG contour for strategy generation (TZ-07): LLM routing, Qdrant, retrieval, repair-loop"
requires-python = ">=3.12"
dependencies = [
    "llama-index>=0.14.23",
    "llama-index-llms-ollama>=0.10.1",
    "niquests>=3.20.1",
    "qdrant-client>=1.18.0",
    "sentence-transformers>=5.6.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-mock>=3.15.1",
]

[tool.uv]
package = false
