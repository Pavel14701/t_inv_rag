# YAML-конфигурация ai-модуля (TZ-06: все параметры в одном месте).
# Значения = прежние дефолты кода; менять можно без правки исходников.

seed: 42  # numpy + torch + random

# Риск-менеджмент / генерация лейблов (ранее хардкод в features.py)
risk:
  atr_period: 14            # период ATR
  atr_floor: 1.0e-6         # нижняя граница ATR (защита от деления на 0)
  tp_atr_multiplier: 2.0    # TP = close + m * ATR(prev)
  sl_atr_multiplier: 1.5    # SL = close - m * ATR(prev)
  min_rr: 0.3333333333333333 # минимальный reward/risk для входа (1/3)
  commission_pct: 0.001     # комиссия, доля за сторону
  slippage_pct: 0.0005      # проскальзывание, доля
  max_bars_hold: 20         # макс. баров удержания (0 = без лимита)
  use_r_multiple: false     # outcome: R-multiple (true) или win/loss (false)
  use_structure_filter: false
  trend_filter: null        # null | 'up' | 'down'

# Архитектура модели (ранее дефолты transformer.py / quickstart.py)
model:
  seq_len: 128
  hidden_size: 128
  num_layers: 4
  num_heads: 8
  dropout: 0.1
  max_seq_len: 1024
  max_ob_seq_len: 256
  n_action_classes: 3
  outcome_mode: binary      # binary | multiclass | regression
  n_outcome_classes: 2
  n_patterns: 10
  ob_embedding_dim: 32
  atr_global: 1.0
  close_idx: 3              # индекс close в price_cols (бывший хардкод)

# Обучение (ранее дефолты quickstart.py / training.py / losses.py)
training:
  epochs: 10
  batch_size: 16
  lr: 1.0e-4
  lambda_outcome: 0.3
  lambda_pattern: 0.1
  val_split: 0.2
  patience: 3               # early stopping (0 = выкл)
  class_weight: true
  # self-training
  num_rounds: 3
  action_threshold: 0.9
  outcome_threshold: 0.8

# Вычислительный бэкенд (TZ-06: CUDA-обучение; Vulkan = DX12-алиас)
compute:
  train_backend: auto       # auto | cuda | cpu        (не-CUDA обучение отброшено)
  infer_backend: auto       # auto | cuda | cpu | onnx_directml | vulkan
  device_id: 0
  onnx_export_dir: runs/onnx  # экспорт модели для инференса вне torch
# vulkan = алиас onnx_directml (DX12): ONNX Runtime DirectML EP работает на тех же
# картах (AMD/Intel/NVIDIA). Чистый Vulkan/GGUF отвергнуты: кастомная архитектура
# модели не поддерживается llama.cpp, backward-pass на Vulkan не существует.
