[pytest]
minversion = 7.0
addopts = -v --tb=short --strict-markers
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    candle: candle indicators tests
    unit: unit tests
    statistics: statistics indicators tests
    overlap: overlap indicators tests
    performance: performance tests
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning