[project]
name = "dte-ta"
version = "0.1.0"
description = "Technical indicator library: NumPy/Numba kernels (causal, warm-up/NaN contract)"
requires-python = ">=3.12"
dependencies = [
    "numba>=0.66.0",
    "numpy>=2.0",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-mock>=3.15.1",
]

[tool.uv]
package = false
