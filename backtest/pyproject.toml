[project]
name = "dte-backtest"
version = "0.1.0"
description = "Deterministic backtest engine: execution, portfolio, metrics (TZ-04)"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "polars>=1.42.1",
    # Кросс-пакетные зависимости (TZ-11 п.4.5: backtest вызывает check()).
    # Члены workspace — виртуальные пакеты (package = false), поэтому
    # runtime-зависимость соседа (risk -> pyyaml) повторяется напрямую.
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-mock>=3.15.1",
]

[tool.uv]
package = false